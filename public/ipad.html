<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>iPad Draw</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #e6e6e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      font-family: sans-serif;
      user-select: none;
    }

    /* TOP TOOLBAR */
    #toolbar {
      display: flex;
      gap: 12px;
      padding: 10px;
      background: #fff;
      box-shadow: 0 0 8px rgba(0,0,0,0.15);
      margin-top: 15px;
      border-radius: 12px;
      align-items: center;
    }

    #colors {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* ROUND COLOR PICKER SMALLER */
    #colorPicker {
      width: 24px;
      height: 24px;
      border: none;
      padding: 0;
      cursor: pointer;
      border-radius: 50%;
      overflow: hidden;
      background: none;
    }

    #colorPicker::-webkit-color-swatch {
      border-radius: 50%;
      border: none;
    }
    #colorPicker::-webkit-color-swatch-wrapper {
      padding: 0;
      border-radius: 50%;
    }

    /* STROKE SLIDER */
    #stroke-slider {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 120px;
    }

    /* DYNAMIC THUMB SIZE & COLOR */
    #sizeSlider {
      --thumbSize: 16px;
      --thumbColor: #000000;
    }

    #sizeSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: var(--thumbSize);
      height: var(--thumbSize);
      background: var(--thumbColor);
      border-radius: 50%;
      cursor: pointer;
    }
    #sizeSlider::-moz-range-thumb {
      width: var(--thumbSize);
      height: var(--thumbSize);
      background: var(--thumbColor);
      border-radius: 50%;
      cursor: pointer;
    }

    #erase {
      padding: 4px 10px;
      background: #ff5050;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* DRAWING AREA */
    canvas {
      margin-top: 15px;
      background: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      touch-action: none;
      border-radius: 8px;
    }

    /* BOTTOM BUTTONS */
    #controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    #controls button {
      padding: 8px 14px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <!-- toolbar -->
  <div id="toolbar">

    <!-- color picker -->
    <div id="colors">
      <label>Farbe:</label>
      <input type="color" id="colorPicker" value="#000000">
    </div>

    <!-- stroke slider -->
    <div id="stroke-slider">
      <label for="sizeSlider">Stiftgröße:</label>
      <input type="range" id="sizeSlider" min="1" max="40" value="4">
    </div>

    <!-- shapes -->
    <select id="shapeTool">
      <option value="free">Freihand</option>
      <option value="line">Linie</option>
      <option value="rect">Rechteck</option>
      <option value="circle">Kreis</option>
      <option value="triangle">Dreieck</option>
    </select>

    <!-- eraser -->
    <button id="erase">Eraser</button>

  </div>

  <!-- canvas -->
  <canvas id="drawArea" width="900" height="600"></canvas>

  <!-- bottom buttons -->
  <div id="controls">
    <button id="clear">Clear</button>
    <button id="send">Send</button>
    <button id="screenshot">Screenshot</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('drawArea');
    const ctx = canvas.getContext('2d');

    let drawing = false;
    let currentColor = "#000000";
    let currentSize = 4;
    let eraseMode = false;

    let shapeMode = "free";
    let startX = 0, startY = 0;
    let previewImg = null;

    const colorPicker = document.getElementById("colorPicker");
    const sizeSlider = document.getElementById("sizeSlider");

    /* dynamic thumb size & color */
    function updateSliderThumb() {
      sizeSlider.style.setProperty("--thumbSize", currentSize + "px");
      sizeSlider.style.setProperty("--thumbColor", currentColor);
    }

    sizeSlider.addEventListener("input", () => {
      currentSize = parseInt(sizeSlider.value);
      updateSliderThumb();
    });

    colorPicker.addEventListener("input", () => {
      eraseMode = false;
      currentColor = colorPicker.value;
      updateSliderThumb();
    });

    document.getElementById("shapeTool").addEventListener("change", (e) => {
      shapeMode = e.target.value;
    });

    document.getElementById("erase").addEventListener("click", () => {
      eraseMode = true;
    });

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) {
      const pos = getPos(e);
      startX = pos.x;
      startY = pos.y;

      if (shapeMode === "free") {
        drawing = true;
        ctx.beginPath();
        ctx.moveTo(startX, startY);
      } else {
        previewImg = ctx.getImageData(0, 0, canvas.width, canvas.height);
      }
    }

    function draw(e) {
      const pos = getPos(e);

      if (shapeMode === "free") {
        if (!drawing) return;
        ctx.lineTo(pos.x, pos.y);
        ctx.strokeStyle = eraseMode ? "#ffffff" : currentColor;
        ctx.lineWidth = currentSize;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke();
        return;
      }

      ctx.putImageData(previewImg, 0, 0);
      ctx.strokeStyle = currentColor;
      ctx.lineWidth = currentSize;

      switch (shapeMode) {
        case "line":
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
          break;

        case "rect":
          ctx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
          break;

        case "circle":
          const r = Math.hypot(pos.x - startX, pos.y - startY);
          ctx.beginPath();
          ctx.arc(startX, startY, r, 0, Math.PI * 2);
          ctx.stroke();
          break;

        case "triangle":
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.lineTo(pos.x, pos.y);
          ctx.lineTo(startX - (pos.x - startX), pos.y);
          ctx.closePath();
          ctx.stroke();
          break;
      }
    }

    function endDraw() {
      drawing = false;
      previewImg = null;
    }

    canvas.addEventListener("mousedown", startDraw);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", endDraw);

    canvas.addEventListener("touchstart", startDraw, { passive:false });
    canvas.addEventListener("touchmove", draw, { passive:false });
    canvas.addEventListener("touchend", endDraw);

    document.getElementById("clear").addEventListener("click", () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    document.getElementById("send").addEventListener("click", () => {
      const dataUrl = canvas.toDataURL("image/png");
      socket.emit("sendImage", dataUrl);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    document.getElementById("screenshot").addEventListener("click", () => {
      const link = document.createElement("a");
      link.href = canvas.toDataURL("image/png");
      link.download = `drawing_${Date.now()}.png`;
      link.click();
    });

    updateSliderThumb(); // initial
  </script>

</body>
</html>
