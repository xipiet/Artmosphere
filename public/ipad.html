<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>iPad Draw</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <style>
    html, body { margin:0; padding:0; height:100%; background:#eef4f8; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; }
    
    /* THEME VIEW */
    #themeView { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    #viewport { position:relative; width:100%; height:100%; }
    canvas#bgCanvas { width:100%; height:100%; display:block; }
    .zone-overlay { position:absolute; left:0; right:0; border-radius:0; pointer-events:auto; display:flex; align-items:center; justify-content:center; user-select:none; cursor:pointer; background: transparent; }
    
    .zone-overlay.zone-0 { animation: breatheZone0 5.4s infinite ease-in-out; }
    .zone-overlay.zone-1 { animation: breatheZone1 5.4s infinite ease-in-out; }
    .zone-overlay.zone-2 { animation: breatheZone2 5.4s infinite ease-in-out; }
    
    @keyframes breatheZone0 {
      0%, 100% { background: transparent; box-shadow: none; }
      12%, 28% { background: rgba(255,255,255,0.12); box-shadow: inset 0 0 50px rgba(255,255,255,0.18); }
      40% { background: transparent; box-shadow: none; }
    }
    
    @keyframes breatheZone1 {
      0%, 40% { background: transparent; box-shadow: none; }
      52%, 68% { background: rgba(255,255,255,0.12); box-shadow: inset 0 0 50px rgba(255,255,255,0.18); }
      80% { background: transparent; box-shadow: none; }
      100% { background: transparent; box-shadow: none; }
    }
    
    @keyframes breatheZone2 {
      0%, 80% { background: transparent; box-shadow: none; }
      92%, 98% { background: rgba(255,255,255,0.12); box-shadow: inset 0 0 50px rgba(255,255,255,0.18); }
      100% { background: transparent; box-shadow: none; }
    }
    
    /* DRAWING VIEW */
    #drawView { display:none; width:100%; flex-direction:column; align-items:center; gap:8px; }
    
    #toolbar {
      display: flex;
      gap: 12px;
      padding: 10px;
      background: #fff;
      box-shadow: 0 0 8px rgba(0,0,0,0.15);
      margin-top: 15px;
      border-radius: 12px;
      align-items: center;
    }

    #colors {
      display: flex;
      gap: 6px;
    }

    .color-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #ccc;
      cursor: pointer;
    }

    #stroke-slider {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 120px;
    }

    #erase {
      padding: 4px 10px;
      background: #ff5050;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #drawArea {
      margin-top: 15px;
      background: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      touch-action: none;
      border-radius: 8px;
    }

    #controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    #controls button {
      padding: 8px 14px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <!-- THEME VIEW (Zone Selection) -->
  <div id="themeView">
    <div id="viewport">
      <canvas id="bgCanvas"></canvas>
      <div id="zone0" class="zone-overlay zone-0" style="top:0; height:33%;"></div>
      <div id="zone1" class="zone-overlay zone-1" style="top:33%; height:34%;"></div>
      <div id="zone2" class="zone-overlay zone-2" style="top:67%; height:33%;"></div>
    </div>
  </div>

  <!-- DRAWING VIEW -->
  <div id="drawView">
    <div id="toolbar">
      <div id="colors">
        <div class="color-btn" data-color="#000000" style="background:#000000"></div>
        <div class="color-btn" data-color="#ff0000" style="background:#ff0000"></div>
        <div class="color-btn" data-color="#00aaff" style="background:#00aaff"></div>
        <div class="color-btn" data-color="#00cc44" style="background:#00cc44"></div>
        <div class="color-btn" data-color="#ff9900" style="background:#ff9900"></div>
        <div class="color-btn" data-color="#ffffff" style="background:#ffffff; border:2px solid #888"></div>
      </div>
      <div id="stroke-slider">
        <label for="sizeSlider">Stift:</label>
        <input type="range" id="sizeSlider" min="1" max="30" value="4">
      </div>
      <button id="erase">Eraser</button>
    </div>

    <canvas id="drawArea" width="800" height="500"></canvas>

    <div id="controls">
      <button id="back">Back to Zones</button>
      <button id="clear">Clear</button>
      <button id="send">Send</button>
      <button id="screenshot">Screenshot Draw</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    
    // Theme view elements
    const themeView = document.getElementById('themeView');
    const drawView = document.getElementById('drawView');
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const zoneEls = [document.getElementById('zone0'), document.getElementById('zone1'), document.getElementById('zone2')];
    
    // Drawing view elements
    const canvas = document.getElementById('drawArea');
    const ctx = canvas.getContext('2d');

    let config = null;
    let activeThemeName = null;
    let theme = null;
    let drawing = false;
    let currentColor = "#000000";
    let currentSize = 4;
    let eraseMode = false;
    let selectedZone = null;

    // THEME DISPLAY
    let bgImg = new Image();
    function drawBgImage() {
      if (!bgImg || !bgImg.complete) return;
      const cw = bgCanvas.width, ch = bgCanvas.height;
      const iw = bgImg.width, ih = bgImg.height;
      const scale = Math.max(cw/iw, ch/ih);
      const w = iw * scale, h = ih * scale;
      const x = (cw - w)/2, y = (ch - h)/2;
      bgCtx.clearRect(0,0,cw,ch);
      bgCtx.drawImage(bgImg, x, y, w, h);
    }

    function resizeBg() {
      const vp = document.getElementById('viewport');
      const rect = vp.getBoundingClientRect();
      bgCanvas.width = rect.width;
      bgCanvas.height = Math.max(320, Math.round(rect.width * 0.56));
      applyZoneLayout();
      if (theme) drawBgImage();
    }
    window.addEventListener('resize', resizeBg);

    function applyZoneLayout() {
      for (let i=0;i<3;i++){
        const el = zoneEls[i];
        if (!theme || !theme.zones || !theme.zones[i]) { el.style.display='none'; continue; }
        el.style.display='flex';
        const z = theme.zones[i];
        const start = z.yStartPct;
        const end = z.yEndPct;
        el.style.top = (start) + '%';
        el.style.height = (end - start) + '%';
      }
    }

    // SOCKET EVENTS
    socket.on('app:init', (d) => {
      config = d.config || d;
      activeThemeName = config.activeTheme;
      theme = config.themes[activeThemeName];
      loadBgAndApply();
    });

    socket.on('config:changed', (newConfig) => {
      config = newConfig;
      activeThemeName = config.activeTheme;
      theme = config.themes[activeThemeName];
      loadBgAndApply();
    });

    function loadBgAndApply() {
      const imageRef = theme.image;
      bgImg = new Image();
      bgImg.src = '/theme-image/' + encodeURIComponent(imageRef);
      bgImg.onload = () => { resizeBg(); drawBgImage(); };
      bgImg.onerror = () => { console.error("Failed to load image:", imageRef); };
      applyZoneLayout();
    }

    // ZONE CLICK HANDLERS
    for (let i=0;i<3;i++){
      zoneEls[i].addEventListener('click', () => {
        selectedZone = theme.zones[i].id;
        enterDrawingMode();
      });
    }

    function enterDrawingMode() {
      themeView.style.display = 'none';
      drawView.style.display = 'flex';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      currentColor = "#000000";
      currentSize = 4;
      eraseMode = false;
    }

    // DRAWING HANDLERS
    const sizeSlider = document.getElementById("sizeSlider");
    sizeSlider.addEventListener("input", () => {
      currentSize = parseInt(sizeSlider.value);
    });

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) {
      drawing = true;
      ctx.beginPath();
      const { x, y } = getPos(e);
      ctx.moveTo(x, y);
    }

    function draw(e) {
      if (!drawing) return;
      const { x, y } = getPos(e);
      ctx.lineTo(x, y);
      ctx.strokeStyle = eraseMode ? "#ffffff" : currentColor;
      ctx.lineWidth = currentSize;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.stroke();
    }

    function endDraw() { drawing = false; }

    canvas.addEventListener("mousedown", startDraw);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", endDraw);

    canvas.addEventListener("touchstart", startDraw, { passive:false });
    canvas.addEventListener("touchmove", draw, { passive:false });
    canvas.addEventListener("touchend", endDraw);

    document.querySelectorAll(".color-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        eraseMode = false;
        currentColor = btn.dataset.color;
      });
    });

    document.getElementById("erase").addEventListener("click", () => {
      eraseMode = true;
    });

    document.getElementById("back").addEventListener("click", () => {
      drawView.style.display = 'none';
      themeView.style.display = 'flex';
    });

    document.getElementById("clear").addEventListener("click", () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    document.getElementById("send").addEventListener("click", () => {
      const dataUrl = canvas.toDataURL("image/png");
      socket.emit("sendImage", { dataUrl, zoneId: selectedZone });
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawView.style.display = 'none';
      themeView.style.display = 'flex';
    });

    document.getElementById("screenshot").addEventListener("click", () => {
      const link = document.createElement("a");
      link.href = canvas.toDataURL("image/png");
      link.download = `drawing_${Date.now()}.png`;
      link.click();
    });

    setTimeout(resizeBg, 120);
  </script>

</body>
</html>
