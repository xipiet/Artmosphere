<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Admin</title>
    <link rel="icon" type="image/png" href="/favicon.png"/>
    <link rel="stylesheet" href="/css/admin.css"/>
  </head>

  <body>
    <h2>Admin — Theme Editor</h2>

    <div>
      <h3 id="currentThemeName">Ocean</h3>

      <div style="margin-top:10px">
        <label>
          <input type="checkbox" id="fadeToggle" checked> Fade enabled (images fade out over time)
        </label>
      </div>

      <div style="margin-top:10px">
        <strong>Zones (percent 0–100). Must be sequential and cover 0..100</strong>
        <div>
          <label>Zone 1 — yStart% <input id="z0start" type="number" value="0" min="0" max="100"> yEnd% <input id="z0end" type="number" value="30" min="0" max="100"></label>
        </div>
        <div>
          <label>Zone 2 — yStart% <input id="z1start" type="number" value="30" min="0" max="100"> yEnd% <input id="z1end" type="number" value="70" min="0" max="100"></label>
        </div>
        <div>
          <label>Zone 3 — yStart% <input id="z2start" type="number" value="70" min="0" max="100"> yEnd% <input id="z2end" type="number" value="100" min="0" max="100"></label>
        </div>
      </div>

      <div>
        <button id="saveBtn">Save Config</button>
        <span id="status"></span>
      </div>

      <div style="margin-top:15px">
        <label>Switch Theme:
          <select id="themeDropdown">
            <option value="">Loading themes...</option>
          </select>
        </label>
      </div>

      <div class="preview" id="preview">Preview (loads image if available)</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/admin.js" defer></script>
  </body>
</html>
