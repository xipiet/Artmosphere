<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artmosphere – Kunstwerk Download</title>
    <link rel="stylesheet" href="css/ipadEndscreen.css">
</head>
<body>
    <!-- Video-Hintergrund -->
    <video autoplay muted loop id="background-video">
        <source src="media/background.mp4" type="video/mp4">
    </video>

    <!-- Navigation (optional, falls benötigt) -->
    <nav>
        <div class="logo">
            <img src="media/favicon.png" alt="Artmosphere Logo">
        </div>
    </nav>

    <!-- Hauptinhalt -->
    <main>
        <h1>Geschafft!</h1>
        <p id="mainMessage">Dein Kunstwerk wird gleich angezeigt!</p>

        <!-- Artwork Name Input Section -->
        <div class="artwork-form" id="artworkForm">
            <label for="artworkName">Dein Name:</label>
            <input type="text" id="artworkName" placeholder="z.B. Peter" maxlength="50">
            <div class="artwork-form-actions">
                <button id="saveArtwork" class="button button-primary" disabled>Speichern</button>
                <button id="discardArtwork" class="button button-secondary" type="button">Verwerfen</button>
            </div>
            <!-- Inline-Feedback (Häkchen / Status), wird nach Speichern gezeigt -->
            <div id="saveStatus" class="save-status" role="status" aria-live="polite"></div>
        </div>

        <a href="/ipad" class="button">Noch etwas malen</a>

<!-- Animation: PNG-Bild bewegt sich von links nach rechts -->
<!--<div class="animation-container">
    <div class="dotted-line"></div>
    <img src="media/test-fisch.png" alt="Gemaltes Bild" class="moving-image">
    <img src="themes/ocean.png" alt="canvas" class="canvas-target">
</div>-->


        <!-- QR-Code und Link -->
        <div class="download-section">
            <img src="media/artmosphereQRcode.png" alt="QR-Code" class="qrcode">
            <div class="link-text">
                <p>Scanne den QR-Code oder öffne diese Website,<br>
                   um dein Kunstwerk herunterzuladen!</p>
                <a href="https://artmosphere.cc" target="_blank">artmosphere.cc</a>
            </div>
        </div>

        
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/ipadEndscreen.js"></script>
</body>
</html>
